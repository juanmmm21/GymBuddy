name = "gymbuddy"
main = "src/index.ts"
# La fecha va al día que soporta el workerd del pool de tests: por delante de él,
# los tests ni siquiera arrancan el runtime.
compatibility_date = "2026-08-22"

# Las passkeys van atadas a este dominio: cambiarlo obliga a cada usuario a crear la suya otra
# vez (ADR 0005). Son el dominio y el origen de la PWA: en local, los de Vite; en producción, los del
# propio Worker, que la sirve (gymbuddy.<subdominio de la cuenta>.workers.dev). Se fijan al
# desplegar, antes de que nadie registre una.
[vars]
WEBAUTHN_RP_ID = "localhost"
WEBAUTHN_ORIGIN = "http://localhost:5173"

# El mismo Worker sirve la PWA ya construida (ADR 0004, revisión del 2026-09-14): un solo origen,
# así que ni CORS ni cabeceras expuestas para renovar la sesión. Las rutas de la app que no son un
# fichero devuelven el index.html, y /api/* entra siempre al Worker: sin eso, una ruta de la API
# que no existe respondería con la app en vez de con el error del contrato.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Los logs del Worker son el único sitio donde se ve un fallo en el edge.
[observability]
enabled = true

# Una sola base de datos para todo lo del usuario: cero estado divergente.
# En local wrangler crea la D1 bajo .wrangler/ y no mira database_id; el identificador
# real se rellena al crear la base de producción con `wrangler d1 create` (fase 14).
[[d1_databases]]
binding = "DB"
database_name = "gymbuddy"
database_id = "local-development"
# drizzle-kit escribe aquí; wrangler y el pool de tests leen de este mismo sitio.
migrations_dir = "drizzle"

# La alarma del aviso de descanso, una por cuenta (ADR 0009). Con almacenamiento SQLite, que es el
# único que admite el plan gratuito. La migración crea la clase una vez y se hereda en producción.
[[durable_objects.bindings]]
name = "REST_NOTICE"
class_name = "RestNoticeAlarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestNoticeAlarm"]

# La sincronización del catálogo avanza un músculo por disparo: diecinueve disparos
# pueblan el snapshot entero. Cada cinco minutos es de sobra para un catálogo anclado a un
# tag inmutable, y deja el gasto en 288 invocaciones al día de las 100.000 del plan gratuito.
[triggers]
crons = ["*/5 * * * *"]

# Producción: `wrangler deploy --env production`. Va aparte para no tocar el database_id de arriba,
# que es el de la D1 local con datos de entrenamiento. `vars` y `d1_databases` no se heredan del
# nivel superior y por eso se repiten; `assets`, `triggers`, `migrations` y `observability` sí
# (`durable_objects` tampoco se hereda). El nombre se fija
# a mano: sin él wrangler desplegaría "gymbuddy-production" y la dirección, que es el rpID de las
# passkeys, sería otra.
[env.production]
name = "gymbuddy"

[env.production.vars]
WEBAUTHN_RP_ID = "gymbuddy.juanmmm21.workers.dev"
WEBAUTHN_ORIGIN = "https://gymbuddy.juanmmm21.workers.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "gymbuddy"
database_id = "2684847d-e4b7-4054-bb54-8d0290b72a48"
migrations_dir = "drizzle"

[[env.production.durable_objects.bindings]]
name = "REST_NOTICE"
class_name = "RestNoticeAlarm"
