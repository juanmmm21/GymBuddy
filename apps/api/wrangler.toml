name = "gymbuddy-api"
main = "src/index.ts"
# La fecha va al día que soporta el workerd del pool de tests: por delante de él,
# los tests ni siquiera arrancan el runtime.
compatibility_date = "2026-08-22"

# Las passkeys van atadas a este dominio: cambiarlo obliga a cada usuario a crear la suya otra
# vez (ADR 0005). Son el dominio y el origen de la PWA, no los del Worker. En local, los de
# Vite; los de producción se fijan al desplegar (fase 14), antes de que nadie registre una.
[vars]
WEBAUTHN_RP_ID = "localhost"
WEBAUTHN_ORIGIN = "http://localhost:5173"

# Los logs del Worker son el único sitio donde se ve un fallo en el edge.
[observability]
enabled = true

# Una sola base de datos para todo lo del usuario: cero estado divergente.
# En local wrangler crea la D1 bajo .wrangler/ y no mira database_id; el identificador
# real se rellena al crear la base de producción con `wrangler d1 create` (fase 14).
[[d1_databases]]
binding = "DB"
database_name = "gymbuddy"
database_id = "local-development"
# drizzle-kit escribe aquí; wrangler y el pool de tests leen de este mismo sitio.
migrations_dir = "drizzle"

# La sincronización del catálogo avanza un músculo por disparo: diecinueve disparos
# pueblan el snapshot entero. Cada cinco minutos es de sobra para un catálogo anclado a un
# tag inmutable, y deja el gasto en 288 invocaciones al día de las 100.000 del plan gratuito.
[triggers]
crons = ["*/5 * * * *"]
